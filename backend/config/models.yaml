# Provider-independence lives HERE. Business code asks for a capability TIER,
# never a vendor model. Switching providers = edit this file, nothing else.
#
# Each tier declares a primary model and an ordered fallback chain. The gateway
# walks the chain on 429/5xx/timeout with a bounded backoff, so a slow or
# rate-limited provider can never freeze a live interview turn.
#
# Model ids are LiteLLM-format: "<provider>/<model>".

tiers:
  # Strong reasoning — question planning (DEIE belief loop), the "brain".
  planner:
    primary: anthropic/claude-sonnet-5
    fallbacks: [gemini/gemini-2.5-pro, openai/gpt-4.1]
    temperature: 0.4
    max_tokens: 1024

  # Fast, warm voice — the Presenter (Maya / Iris). Low latency matters most.
  presenter:
    primary: gemini/gemini-2.5-flash
    fallbacks: [groq/llama-3.3-70b-versatile, groq/llama-3.1-8b-instant]
    temperature: 0.7
    max_tokens: 300

  # Structured scoring — Evaluation Engine raters. Accuracy over speed.
  scorer:
    primary: anthropic/claude-sonnet-5
    fallbacks: [gemini/gemini-2.5-pro]
    temperature: 0.2
    max_tokens: 1500

  # Cheap bulk work — classification, extraction, meta-command routing.
  cheap:
    primary: groq/llama-3.1-8b-instant
    fallbacks: [gemini/gemini-2.5-flash]
    temperature: 0.3
    max_tokens: 512

# Bounded rate-limit backoff (mirrors the 2.5s cap we shipped on the JS side):
# if a provider says "retry in Ns" and N*1000 > this, we skip the wait and fail
# over to the next model instead of hanging the turn.
rate_limit:
  max_wait_ms: 2500
