[project]
name = "jobstream-backend"
version = "0.1.0"
description = "AI-native Python backend for the JobStream AI Hiring OS (P0: provider-independent spine)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "litellm>=1.53",          # unified provider API (OpenAI/Anthropic/Gemini/Groq/…)
    "langgraph>=0.2",         # agent orchestration + checkpointing (interview turn loop)
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.4",        # structured JSON logging
    "sse-starlette>=2.1",     # streaming responses to the browser
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
