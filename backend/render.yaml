# Render Blueprint — one-click deploy of the JobStream Python backend
# (FastAPI + WebSocket voice relay + Postgres). Render supports WebSockets, so
# the Gemini Live voice relay works here (Vercel can't host it).
#
# Deploy: push this repo, then in Render → "New +" → "Blueprint" → pick this repo
# (branch backend/python-rewrite, root dir `backend`). Set GEMINI_API_KEY in the
# dashboard (Live API enabled on the Google project). The rest wires itself.
#
# After deploy, point the frontend at it:
#   NEXT_PUBLIC_VOICE_WS_URL = wss://<your-service>.onrender.com/v1/voice/ws

services:
  - type: web
    name: jobstream-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # free = $0/month for the pilot (sleeps after ~15 min idle, ~30s cold start).
    # Upgrade to `starter` (~$7/mo) later to keep the voice service always warm.
    plan: free
    autoDeploy: true
    envVars:
      - key: JS_ENV
        value: production
      - key: GEMINI_API_KEY  # set in the dashboard — used by LiteLLM + Gemini Live
        sync: false
      - key: GROQ_API_KEY    # optional fallback provider
        sync: false
      - key: JS_API_KEY      # protects analytics/CRM routes (X-API-Key)
        generateValue: true
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash-live-001
      - key: JS_DATABASE_URL
        fromDatabase:
          name: jobstream-db
          property: connectionString

databases:
  - name: jobstream-db
    plan: free
    databaseName: jobstream
    postgresMajorVersion: "16"
